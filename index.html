<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1114">
<title>HI-ORR Time Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F1114;--bg2:#16181D;--bg3:#1A1D23;--border:#27272A;--border2:#1E1E22;
  --t1:#E4E4E7;--t2:#D4D4D8;--t3:#A1A1AA;--t4:#71717A;--t5:#52525B;--t6:#3F3F46;
  --blue:#3B82F6;--red:#E8654A;--purple:#A78BFA;--amber:#F59E0B;--green:#10B981;--gray:#6B7280;
  --font:'JetBrains Mono','SF Mono','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;min-height:100vh;overflow-x:hidden}
.app{max-width:560px;margin:0 auto;padding:20px 16px;padding-bottom:80px}
.hdr{border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:20px}
.hdr-title{font-size:11px;letter-spacing:4px;color:var(--t4);text-transform:uppercase;margin-bottom:2px}
.hdr-sub{font-size:12px;color:var(--t5)}
.tabs{display:flex;border-bottom:1px solid var(--border2);margin-bottom:20px}
.tab{flex:1;padding:10px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--t5);font-size:11px;font-family:var(--font);cursor:pointer;letter-spacing:1px;transition:all .2s}
.tab.active{color:var(--t1);border-bottom-color:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:20px;transition:all .3s}
.card.running{background:var(--bg3)}
.label{font-size:11px;color:var(--t4);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.timer-display{font-size:36px;font-weight:300;letter-spacing:2px;margin-bottom:6px}
.task-name{font-size:13px;color:var(--t3);margin-bottom:2px}
.proj-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.proj-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.proj-label{font-size:11px;color:var(--t4)}
input[type="text"],input[type="number"]{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--t1);font-size:14px;font-family:var(--font);padding:8px 0;outline:none}
input::placeholder{color:var(--t6)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.pill{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t5);font-size:11px;font-family:var(--font);cursor:pointer;transition:all .2s;white-space:nowrap}
.pill.active{background:color-mix(in srgb, var(--pill-color) 15%, transparent);border-color:var(--pill-color);color:var(--pill-color)}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:12px;font-family:var(--font);font-weight:500;cursor:pointer;letter-spacing:1px;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:disabled{background:var(--border);color:var(--t5);cursor:default}
.btn-stop{color:#fff}
.btn-sm{padding:4px 10px;width:auto;border-radius:20px;font-size:10px}
.mode-toggle{display:flex;gap:8px;margin-bottom:10px}
.day-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-nav button{background:none;border:none;color:var(--t4);font-size:20px;cursor:pointer;padding:6px 10px}
.day-nav button:disabled{color:var(--border);cursor:default}
.day-center{text-align:center}
.day-date{font-size:13px;color:var(--t3)}
.day-hrs{font-size:11px;color:var(--t5)}
.entry{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg2);border-radius:8px;border-left:3px solid var(--gray);margin-bottom:2px}
.entry-info{flex:1;min-width:0}
.entry-task{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:10px;color:var(--t5)}
.entry-hrs{font-size:12px;color:var(--t3);flex-shrink:0}
.entry-del{background:none;border:none;color:var(--t6);cursor:pointer;font-size:16px;padding:2px 6px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{width:100px;font-size:11px;color:var(--t4);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bar-val{font-size:11px;color:var(--t3);width:50px;text-align:right;flex-shrink:0}
.week-card{margin-bottom:10px;padding:8px 10px;background:var(--bg2);border-radius:8px}
.week-hdr{display:flex;justify-content:space-between;margin-bottom:4px}
.week-label{font-size:11px;color:var(--t3)}
.week-hrs{font-size:11px;color:var(--t1)}
.week-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px}
.week-seg{min-width:2px}
.exp-btn{width:100%;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:13px;font-family:var(--font);cursor:pointer;text-align:left;margin-bottom:8px;transition:border-color .2s}
.exp-btn:active{border-color:var(--blue)}
.exp-desc{font-size:11px;color:var(--t5);margin-top:4px}
.exp-msg{margin-top:12px;font-size:12px;color:var(--green);text-align:center}
.exp-section-title{font-size:11px;color:var(--t5);letter-spacing:1px;text-transform:uppercase;margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--border2)}
.settings-section{margin-bottom:20px}
.proj-edit-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:8px;margin-bottom:4px}
.proj-edit-name{flex:1;font-size:12px;color:var(--t2)}
.proj-edit-del{background:none;border:none;color:var(--t6);cursor:pointer;font-size:14px;padding:2px 6px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-size:12px;font-family:var(--font);padding:8px 10px}
.add-row button{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:var(--font);cursor:pointer}
.empty{text-align:center;padding:30px 0;color:var(--t6);font-size:12px}
.info-box{margin-top:20px;padding:12px;background:var(--bg2);border-radius:8px;font-size:11px;color:var(--t5);line-height:1.6}
.info-box strong{color:var(--t4)}
.warn{color:var(--amber)}
input[type="file"]{display:none}
@media(max-width:400px){.timer-display{font-size:28px}.bar-label{width:70px;font-size:10px}.tab{font-size:10px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="file-import" accept=".json" onchange="handleImport(this)">
<script>
const DS="2026-03-07",DE="2026-12-31";
const DEF_PROJ=["DR4724 Kona Low","RSF Standup","SWRCM","Interagency Coord","Admin","Other"];
const COLORS={"DR4724 Kona Low":"#E8654A","RSF Standup":"#3B82F6","SWRCM":"#A78BFA","Interagency Coord":"#F59E0B","Admin":"#10B981","Other":"#6B7280"};
const FB="#6B7280",gc=p=>COLORS[p]||FB;

let state={
  entries:JSON.parse(localStorage.getItem("hiorr-entries")||"[]"),
  projects:JSON.parse(localStorage.getItem("hiorr-projects")||"null")||DEF_PROJ,
  running:JSON.parse(localStorage.getItem("hiorr-running")||"null"),
  tab:"Timer",viewDate:clamp(todayK()),task:"",project:null,manual:false,manHrs:"1",newProj:"",exportMsg:""
};
state.project=state.projects[0]||"Other";
let timerInterval=null;

function save(){localStorage.setItem("hiorr-entries",JSON.stringify(state.entries));localStorage.setItem("hiorr-projects",JSON.stringify(state.projects));localStorage.setItem("hiorr-running",JSON.stringify(state.running))}
function todayK(){return new Date().toISOString().slice(0,10)}
function clamp(d){return d<DS?DS:d>DE?DE:d}
function fmtD(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return`${p2(h)}:${p2(m)}:${p2(sc)}`}
function p2(n){return String(n).padStart(2,"0")}
function fmtH(ms){return(ms/36e5).toFixed(1)+"h"}
function fmtHn(ms){return(ms/36e5).toFixed(2)}
function fmtT(ts){return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function weekOf(ds){const d=new Date(ds+"T12:00:00"),day=d.getDay(),m=new Date(d);m.setDate(d.getDate()-((day+6)%7));return m.toISOString().slice(0,10)}
function escH(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function elapsed(){return state.running?Date.now()-state.running.start:0}

function setTab(t){state.tab=t;render()}
function setViewDate(d){state.viewDate=clamp(d);render()}
function prevDay(){const d=new Date(state.viewDate+"T12:00:00");d.setDate(d.getDate()-1);setViewDate(d.toISOString().slice(0,10))}
function nextDay(){const d=new Date(state.viewDate+"T12:00:00");d.setDate(d.getDate()+1);setViewDate(d.toISOString().slice(0,10))}
function startTimer(){if(!state.task.trim())return;state.running={task:state.task.trim(),project:state.project,start:Date.now()};save();render();startTick()}
function stopTimer(){if(!state.running)return;const n=Date.now();state.entries.unshift({id:n,task:state.running.task,project:state.running.project,start:state.running.start,end:n,duration:n-state.running.start,date:new Date(state.running.start).toISOString().slice(0,10)});state.running=null;state.task="";save();render()}
function addManual(){if(!state.task.trim()||!state.manHrs)return;const h=parseFloat(state.manHrs);if(isNaN(h)||h<=0)return;const ms=h*36e5,n=Date.now();state.entries.unshift({id:n,task:state.task.trim(),project:state.project,start:n-ms,end:n,duration:ms,date:state.viewDate,manual:true});state.task="";state.manHrs="1";save();render()}
function deleteEntry(id){state.entries=state.entries.filter(e=>e.id!==id);save();render()}
function addProject(){const p=state.newProj.trim();if(p&&!state.projects.includes(p)){state.projects.push(p);state.project=p}state.newProj="";save();render()}
function removeProject(p){state.projects=state.projects.filter(x=>x!==p);if(state.project===p)state.project=state.projects[0]||"Other";save();render()}
function startTick(){clearInterval(timerInterval);if(state.running){timerInterval=setInterval(()=>{const el=document.getElementById("timer-val");if(el)el.textContent=fmtD(elapsed())},1000)}}

function rangeEntries(){return state.entries.filter(e=>e.date>=DS&&e.date<=DE).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start)}
function byProject(re){const bp={};re.forEach(e=>{bp[e.project]=(bp[e.project]||0)+e.duration});return bp}
function byWeekData(re){const w={};re.forEach(e=>{const wk=weekOf(e.date);if(!w[wk])w[wk]={};w[wk][e.project]=(w[wk][e.project]||0)+e.duration});return Object.entries(w).sort((a,b)=>a[0].localeCompare(b[0]))}
function showMsg(m){state.exportMsg=m;render();setTimeout(()=>{state.exportMsg="";render()},3000)}
function dlFile(content,name,mime){const b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}

// ===== BACKUP: JSON EXPORT/IMPORT =====
function exportBackup(){
  const data={version:1,exported:new Date().toISOString(),entries:state.entries,projects:state.projects};
  dlFile(JSON.stringify(data,null,2),"hiorr-backup-"+todayK()+".json","application/json");
  showMsg("Backup saved");
}
function triggerImport(){document.getElementById("file-import").click()}
function handleImport(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.entries||!Array.isArray(data.entries))throw new Error("Invalid format");
      // Merge: add entries that don't already exist by id
      const existingIds=new Set(state.entries.map(e=>e.id));
      let added=0;
      data.entries.forEach(entry=>{
        if(!existingIds.has(entry.id)){state.entries.push(entry);added++}
      });
      // Merge projects
      if(data.projects&&Array.isArray(data.projects)){
        data.projects.forEach(p=>{if(!state.projects.includes(p))state.projects.push(p)});
      }
      state.entries.sort((a,b)=>b.id-a.id);
      save();render();
      showMsg(`Imported ${added} new entries`+(added===0?" (all duplicates)":""));
    }catch(err){showMsg("Import failed: invalid file")}
  };
  reader.readAsText(file);
  input.value="";
}

// ===== EXPORT: CSV =====
function exportCSV(){
  const re=rangeEntries();
  const rows=[["Date","Project","Task","Hours","Type"]];
  re.forEach(e=>rows.push([e.date,e.project,e.task,fmtHn(e.duration),e.manual?"Manual":"Timer"]));
  dlFile(rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"),"hi-orr-timesheet-"+todayK()+".csv","text/csv");
}

// ===== EXPORT: EXCEL =====
function exportExcel(){
  const re=rangeEntries(),bp=byProject(re),bw=byWeekData(re),grand=re.reduce((a,e)=>a+e.duration,0);
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(re.map(e=>({Date:e.date,Project:e.project,Task:e.task,Hours:+(fmtHn(e.duration)),Type:e.manual?"Manual":"Timer"})));
  ws1["!cols"]=[{wch:12},{wch:22},{wch:40},{wch:8},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws1,"Detailed Log");
  const projData=Object.entries(bp).sort((a,b)=>b[1]-a[1]).map(([p,ms])=>({Project:p,Hours:+(fmtHn(ms)),Percent:grand>0?+((ms/grand*100).toFixed(1)):0}));
  projData.push({Project:"TOTAL",Hours:+(fmtHn(grand)),Percent:100});
  const ws2=XLSX.utils.json_to_sheet(projData);ws2["!cols"]=[{wch:24},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws2,"By Project");
  const weekRows=[];bw.forEach(([wk,projs])=>{const wt=Object.values(projs).reduce((a,v)=>a+v,0);const row={"Week Of":new Date(wk+"T12:00:00").toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"}),"Total Hours":+(fmtHn(wt))};state.projects.forEach(p=>{row[p]=projs[p]?+(fmtHn(projs[p])):0});weekRows.push(row)});
  const ws3=XLSX.utils.json_to_sheet(weekRows);ws3["!cols"]=[{wch:16},{wch:12},...state.projects.map(()=>({wch:14}))];
  XLSX.utils.book_append_sheet(wb,ws3,"By Week");
  XLSX.writeFile(wb,"hi-orr-timesheet-"+todayK()+".xlsx");showMsg("Downloaded Excel file");
}

// ===== EXPORT: PDF =====
function exportPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"letter"});
  const re=rangeEntries(),bp=byProject(re),bw=byWeekData(re),grand=re.reduce((a,e)=>a+e.duration,0);
  const pw=doc.internal.pageSize.getWidth(),lm=16,rm=16,cw=pw-lm-rm;
  let y=18;
  function checkPage(n){if(y+n>doc.internal.pageSize.getHeight()-16){doc.addPage();y=18}}

  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(30,30,30);
  doc.text("HI-ORR Time Tracker Report",lm,y);y+=8;
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(100,100,100);
  doc.text("Period: March 7 – December 31, 2026",lm,y);y+=5;
  doc.text("Generated: "+new Date().toLocaleDateString([],{weekday:"long",year:"numeric",month:"long",day:"numeric"}),lm,y);y+=5;
  doc.text("Total Hours: "+fmtHn(grand),lm,y);y+=10;
  doc.setDrawColor(200);doc.line(lm,y,pw-rm,y);y+=8;

  doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(30,30,30);
  doc.text("Project Summary",lm,y);y+=7;
  const projRows=Object.entries(bp).sort((a,b)=>b[1]-a[1]).map(([p,ms])=>[p,fmtHn(ms)+" hrs",grand>0?((ms/grand*100).toFixed(1)+"%"):"0%"]);
  projRows.push(["TOTAL",fmtHn(grand)+" hrs","100%"]);
  doc.autoTable({startY:y,margin:{left:lm,right:rm},head:[["Project","Hours","% of Total"]],body:projRows,styles:{font:"helvetica",fontSize:9,cellPadding:2.5},headStyles:{fillColor:[59,130,246],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[245,245,250]}});
  y=doc.lastAutoTable.finalY+10;

  checkPage(20);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(30,30,30);doc.text("Weekly Breakdown",lm,y);y+=7;
  const weekHead=["Week Of","Total",...state.projects];
  const weekRowsPDF=bw.map(([wk,projs])=>{const wt=Object.values(projs).reduce((a,v)=>a+v,0);return[new Date(wk+"T12:00:00").toLocaleDateString([],{month:"short",day:"numeric"}),fmtHn(wt),...state.projects.map(p=>projs[p]?fmtHn(projs[p]):"-")]});
  doc.autoTable({startY:y,margin:{left:lm,right:rm},head:[weekHead],body:weekRowsPDF,styles:{font:"helvetica",fontSize:8,cellPadding:2},headStyles:{fillColor:[59,130,246],textColor:255,fontStyle:"bold",fontSize:7},alternateRowStyles:{fillColor:[245,245,250]},columnStyles:{0:{cellWidth:22},1:{cellWidth:14}}});
  y=doc.lastAutoTable.finalY+10;

  checkPage(20);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(30,30,30);doc.text("Detailed Log",lm,y);y+=7;
  doc.autoTable({startY:y,margin:{left:lm,right:rm},head:[["Date","Project","Task","Hours","Type"]],body:re.map(e=>[e.date,e.project,e.task,fmtHn(e.duration),e.manual?"Manual":"Timer"]),styles:{font:"helvetica",fontSize:8,cellPadding:2},headStyles:{fillColor:[59,130,246],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[245,245,250]},columnStyles:{0:{cellWidth:22},1:{cellWidth:30},2:{cellWidth:cw-22-30-16-14},3:{cellWidth:14},4:{cellWidth:16}},
    didDrawPage:function(){doc.setFontSize(8);doc.setTextColor(150);doc.text("HI-ORR Time Tracker",lm,doc.internal.pageSize.getHeight()-8);doc.text("Page "+doc.internal.getCurrentPageInfo().pageNumber,pw-rm,doc.internal.pageSize.getHeight()-8,{align:"right"})}});

  doc.save("hi-orr-time-report-"+todayK()+".pdf");showMsg("Downloaded PDF report");
}

function render(){
  const app=document.getElementById("app");
  const re=rangeEntries(),grand=re.reduce((a,e)=>a+e.duration,0);
  const dayE=state.entries.filter(e=>e.date===state.viewDate);
  const dayTot=dayE.reduce((a,e)=>a+e.duration,0);
  const isToday=state.viewDate===todayK();
  const bp=byProject(re),maxP=Math.max(...Object.values(bp),1),bw=byWeekData(re);
  const allTabs=["Timer","Log","Summary","Export","Settings"];

  let h=`<div class="hdr"><div class="hdr-title">HI-ORR Time Tracker</div><div class="hdr-sub">Mar 7 – Dec 31, 2026 · ${fmtH(grand)} total</div></div>
    <div class="tabs">${allTabs.map(t=>`<button class="tab${state.tab===t?" active":""}" onclick="setTab('${t}')">${t}</button>`).join("")}</div>`;

  if(state.tab==="Timer"){
    if(state.running){const c=gc(state.running.project);
      h+=`<div class="card running" style="border-color:${c}44"><div class="label">Running</div><div class="timer-display" id="timer-val" style="color:${c}">${fmtD(elapsed())}</div><div class="task-name">${escH(state.running.task)}</div><div class="proj-badge"><span class="proj-dot" style="background:${c}"></span><span class="proj-label">${escH(state.running.project)}</span></div><button class="btn btn-stop" style="background:${c}" onclick="stopTimer()">STOP</button></div>`;
    } else {
      h+=`<div class="card"><div class="mode-toggle"><button class="pill btn-sm${!state.manual?" active":""}" style="--pill-color:var(--blue)" onclick="state.manual=false;render()">Timer</button><button class="pill btn-sm${state.manual?" active":""}" style="--pill-color:var(--blue)" onclick="state.manual=true;render()">Manual</button></div>
        <input type="text" id="task-input" placeholder="What are you working on?" value="${escH(state.task)}" oninput="state.task=this.value" onkeydown="if(event.key==='Enter'){state.manual?addManual():startTimer()}" style="margin-bottom:10px">
        ${state.manual?`<input type="number" id="hrs-input" placeholder="Hours" step="0.25" min="0.25" value="${escH(state.manHrs)}" oninput="state.manHrs=this.value" style="margin-bottom:10px;width:140px">`:""}
        <div class="pills">${state.projects.map(p=>`<button class="pill${state.project===p?" active":""}" style="--pill-color:${gc(p)}" onclick="state.project='${escH(p)}';render()">${escH(p)}</button>`).join("")}</div>
        <button class="btn btn-primary" ${state.task.trim()?"":"disabled"} onclick="state.manual?addManual():startTimer()">${state.manual?"LOG ENTRY":"START"}</button></div>`;
    }
  }

  if(state.tab==="Log"||state.tab==="Timer"){
    h+=`<div class="day-nav"><button onclick="prevDay()" ${state.viewDate<=DS?"disabled":""}>‹</button><div class="day-center"><div class="day-date">${isToday?"Today":new Date(state.viewDate+"T12:00:00").toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}</div><div class="day-hrs">${fmtH(dayTot)} logged</div></div><button onclick="nextDay()" ${state.viewDate>=DE||isToday?"disabled":""}>›</button></div>`;
    if(dayE.length===0){h+=`<div class="empty">No entries${isToday?" yet":""}</div>`}
    else dayE.forEach(e=>{h+=`<div class="entry" style="border-left-color:${gc(e.project)}"><div class="entry-info"><div class="entry-task">${escH(e.task)}</div><div class="entry-meta">${escH(e.project)} · ${e.manual?"manual":`${fmtT(e.start)}–${fmtT(e.end)}`}</div></div><div class="entry-hrs">${fmtH(e.duration)}</div><button class="entry-del" onclick="deleteEntry(${e.id})">×</button></div>`});
  }

  if(state.tab==="Summary"){
    h+=`<div class="label">Period Total: <span style="color:var(--t1)">${fmtH(grand)}</span></div><div style="margin:16px 0 28px"><div style="font-size:11px;color:var(--t5);margin-bottom:8px">By Project</div>`;
    if(!Object.keys(bp).length)h+=`<div class="empty">No data yet</div>`;
    else Object.entries(bp).sort((a,b)=>b[1]-a[1]).forEach(([p,ms])=>{h+=`<div class="bar-row"><span class="bar-label">${escH(p)}</span><div class="bar-track"><div class="bar-fill" style="width:${(ms/maxP)*100}%;background:${gc(p)}"></div></div><span class="bar-val">${fmtH(ms)}</span></div>`});
    h+=`</div><div style="font-size:11px;color:var(--t5);margin-bottom:8px">By Week</div>`;
    if(!bw.length)h+=`<div class="empty">No data yet</div>`;
    else bw.forEach(([wk,projs])=>{const wt=Object.values(projs).reduce((a,v)=>a+v,0);h+=`<div class="week-card"><div class="week-hdr"><span class="week-label">Wk of ${new Date(wk+"T12:00:00").toLocaleDateString([],{month:"short",day:"numeric"})}</span><span class="week-hrs">${fmtH(wt)}</span></div><div class="week-bar">${Object.entries(projs).map(([p,ms])=>`<div class="week-seg" style="width:${(ms/wt)*100}%;background:${gc(p)}" title="${escH(p)}: ${fmtH(ms)}"></div>`).join("")}</div></div>`});
  }

  if(state.tab==="Export"){
    h+=`<div class="label" style="margin-bottom:16px">Export & Backup</div>
      <div class="exp-section-title" style="margin-top:0;border:none">Reports</div>
      <button class="exp-btn" onclick="exportPDF()">PDF Report<div class="exp-desc">Formatted report with project summary, weekly breakdown, and full log.</div></button>
      <button class="exp-btn" onclick="exportExcel()">Excel Workbook<div class="exp-desc">Multi-sheet .xlsx — Detailed Log, By Project, By Week.</div></button>
      <button class="exp-btn" onclick="exportCSV()">CSV<div class="exp-desc">Flat file of all entries.</div></button>
      <div class="exp-section-title">Backup & Restore</div>
      <button class="exp-btn" onclick="exportBackup()">Save Backup<div class="exp-desc">Download a .json file with all your data. Do this regularly!</div></button>
      <button class="exp-btn" onclick="triggerImport()">Restore from Backup<div class="exp-desc">Import a .json backup. Merges with existing data — won't create duplicates.</div></button>
      ${state.exportMsg?`<div class="exp-msg">${escH(state.exportMsg)}</div>`:""}
      <div class="info-box"><strong>How your data works:</strong><br>Your entries are saved in <strong>this browser's localStorage</strong> on this device. Data persists between visits but is specific to this browser.<br><br><span class="warn">⚠ Back up regularly.</span> Clearing browser data or switching devices will lose entries unless you've saved a backup.</div>`;
  }

  if(state.tab==="Settings"){
    h+=`<div class="label" style="margin-bottom:16px">Projects</div><div class="settings-section">`;
    state.projects.forEach(p=>{h+=`<div class="proj-edit-row"><span class="proj-dot" style="background:${gc(p)};flex-shrink:0"></span><span class="proj-edit-name">${escH(p)}</span><button class="proj-edit-del" onclick="removeProject('${escH(p)}')">×</button></div>`});
    h+=`<div class="add-row"><input type="text" id="new-proj-input" placeholder="New project name" value="${escH(state.newProj)}" oninput="state.newProj=this.value" onkeydown="if(event.key==='Enter')addProject()"><button onclick="addProject()">Add</button></div></div>
      <div class="label" style="margin-bottom:12px;margin-top:24px">Data Management</div>
      <button class="exp-btn" onclick="if(confirm('Delete all entries? This cannot be undone.')){state.entries=[];save();render()}">Clear All Entries<div class="exp-desc">Remove all logged time data</div></button>
      <button class="exp-btn" onclick="if(confirm('Reset everything including projects?')){localStorage.removeItem('hiorr-entries');localStorage.removeItem('hiorr-projects');localStorage.removeItem('hiorr-running');location.reload()}">Full Reset<div class="exp-desc">Clear all data and restore defaults</div></button>`;
  }

  app.innerHTML=h;startTick();
}
render();
</script>
</body>
</html>
